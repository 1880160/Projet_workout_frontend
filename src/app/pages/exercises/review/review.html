<div class="bg-base-300 w-screen min-h-screen  p-4">
    <div class="flex flex-row gap-5 p-5">
        <div class="flex-none align-center">
            <button class="btn" (click)="navigateExercise()">Back to exercises</button>
        </div>
        <div class="flex-1">
            <h1 class="text-4xl font-bold">Exercise Review</h1>
            <p class="text-secondary">Review and approve user-submitted exercises</p>
        </div>
        <div class="flex-none">
            <h2 class="badge font-semibold badge-primary">Admin Panel</h2>
        </div>
    </div>
    <div class="card bg-base-200">

        <div class="card-body">
            @for (exerciseRequest of this.exercisesRequestData.value(); track $index) {

                <app-exercise-display (onRejectEvent)="deleteExerciseRequest($event)"  (onApproveEvent)="approveExerciseRequest($event)" [displayMode]="displayModeApprouvable" [exercise]="exerciseRequest"></app-exercise-display>
            }
        
        </div>
    </div>
</div>
