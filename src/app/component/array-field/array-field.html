<div class="flex flex-col rounded-md bg-base-200 p-2 gap-2">
    <div class="flex-1 flex flex-row gap-2 font-medium">
        <select class="select select-ghost bg-base-300 w-full" [formField]="optionsSelectionForm.selection">
            @for (item of options(); track $index) {
            <option [value]="item">{{item}}</option>
            }
        </select>
    <button class="btn btn-primary flex-none" (click)="addArray()">
        +
    </button>
    </div>
    <div class="flex flex-col gap-2">
        @for (item of this.optionsSelectionForm().value().selectedOptions; track $index) {
        <div class="badge badge-primary flex w-full min-h-15" [id]="$index">
            <div class="flex-1">
                <p>{{item}}</p>
            </div>
            <div class="flex-none">
                <button class="btn btn-base-300" [id]="$index" (click)="removeArray($index)">-</button>
            </div>
        </div>
        }
    </div>
    <div>

    </div>
</div>
