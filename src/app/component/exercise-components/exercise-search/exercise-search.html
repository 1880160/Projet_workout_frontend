<div class="flex flex-col gap-4">
    <app-exercise-filter (onFiltersUpdated)="onUpdatedfilter($event)"></app-exercise-filter>
    <div>
        <div class="flex">
            <div class="flex-1">
                <p class="text-base-content">Showing {{exercisesData.value()?.length}} out of
                    {{exercisesData.value()?.length}} exercises</p>
            </div>

        </div>
        <div class="grid grid-cols-2 p-4 gap-10">
            @for (exercise of exercisesData.value(); track exercise.exerciseId) {
            <app-exercise-display  [displayMode]="exerciseDisplayMode()" [exercise]="exercise" (onClickEvent)="onExerciseSelected($event)"></app-exercise-display>
            }
        </div>
    </div>
</div>
