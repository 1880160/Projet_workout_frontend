<div class="modal-box">
    <div class="flex">
        <div class="flex-1">
            <h2 class="font-extrabold text-3xl">Notifications</h2>
        </div>
        <div class="flex-none">
            <button class="btn btn-ghost" (click)="closeDialog()">Close</button>
        </div>
    </div>
    <div>
        <p>
            Stay updated with your workout alerts and exercise status
        </p>
    </div>
    <div class="flex flex-col gap-2">
        @for (notification of notifications(); track $index) {
            <app-notification-display [notification]="notification" (onDeleteEvent)="deleteNotification($event)" />
        }
    </div>
</div>
