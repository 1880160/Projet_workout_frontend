    <div class="card-body">
        <div class="flex">
            <div class="flex flex-col flex-1 gap-2">
                <h3 class="font-semibold text-3xl">
                    {{ exercise()?.name }}
                </h3>
                <div class="flex gap-2 capitalize ">
                    @for (item of exercise()?.primaryMuscles; track item) {
                    <div class="badge badge-primary font-bold">{{item}}</div>
                    }
                    @for (item of exercise()?.secondaryMuscles; track item) {
                    <div class="badge badge-secondary font-bold">{{item}}</div>
                    }
                </div>
            </div>

        </div>
        <div>
            {{ exercise()?.instructions}}
        </div>
        <div class="flex gap-2 font-bold capitalize  ">
            <div class="badge badge-info ">
                <p class="">
                    {{exercise()?.category}}
                </p>
            </div>
            <div class="badge badge-info">
                <p>
                {{exercise()?.equipment}}
                </p>
            </div>
            <div class="badge badge-info">
                <p>
                {{exercise()?.level}}
                </p>
            </div>
        </div>
        <div [hidden]="!isSelectable()">
            <button class="btn btn-primary w-full" (click)="execiseClick()">Select Exercise</button>
        </div>
